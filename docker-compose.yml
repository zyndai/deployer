# Local-dev stack. One command brings everything up:
#   docker compose up --build
#
# Notes on the dual "data root" env vars:
#   DEPLOYER_DATA_ROOT = the path the worker process writes to, inside
#       its own container (here: /data)
#   HOST_DATA_ROOT     = the path the Docker daemon sees on the host
#       (here: whatever ${PWD}/.data resolves to). The worker uses this
#       when constructing bind-mount specs for the user's deployment
#       containers, which the daemon spawns as siblings via the mounted
#       docker.sock.
#
# The master age key lives at ./master.age on the host and is mounted
# read-only into both services at /app/master.age.

services:
  postgres:
    image: postgres:16-alpine
    # Pin platform so Docker Desktop on Apple Silicon doesn't fall back
    # to amd64 under Rosetta. Mismatched native binaries (Next's SWC,
    # Prisma's query engine) cause SIGBUS under emulation.
    platform: linux/arm64
    environment:
      POSTGRES_USER: zynd
      POSTGRES_PASSWORD: zynd
      POSTGRES_DB: zynd_deployer
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zynd -d zynd_deployer"]
      interval: 2s
      timeout: 3s
      retries: 30

